rting.\nmy philosophy? good copy should feel like a late-night talk with a friend or a familiar melody playing in a local coffee shop. it’s strategic, yes, but it always starts with genuine connection. i specialize in translating complex ideas, brand concepts, and creative visions into warm, resonant, and memorable stories.\n\nif you’re looking for a writer to give your brand a soul, or just want to collaborate on something thoughtful let’s chat over a virtual coffee.","icon":"images/img-94a3afcd54.png","c1":"var(--blossom)","c2":"var(--paper)","x":32,"y":46,"previews":[],"credits":[{"r":"Copywriter","n":"Syafira Putri Aulia"}],"blocks":[{"k":"img","src":"images/img-8ccc825097.jpg","name":"5.PNG","cap":""}]},{"id":"p3","type":"project","label":"The Art of Emphaty","sub":"Personal","kind":"Copywriting, Concept & Design","desc":"in a world that’s always moving too fast, i wanted to create a cozy visual space to talk about connection. \"the art of empathy\" is a tactile, interactive zine designed to redefine how we listen, see, and understand each other. no textbook boring stuff—just raw thoughts and good energy.","icon":"images/img-484af37f31.jpg","c1":"var(--leaf)","c2":"var(--mist)","x":66,"y":22,"previews":[],"credits":[{"r":"Copywriter","n":"Syafira Putri Aulia"}],"blocks":[{"k":"img","src":"images/img-cdfc9cdabf.jpg","name":"4.png","cap":""},{"k":"img","src":"images/img-389d380ce3.jpg","name":"5.png","cap":""},{"k":"img","src":"images/img-800427bb66.jpg","name":"6.png","cap":""},{"k":"img","src":"images/img-540f436dfa.jpg","name":"7.png","cap":""},{"k":"img","src":"images/img-0a4f59cdd0.jpg","name":"8.png","cap":""},{"k":"img","src":"images/img-d4ff11a3a4.jpg","name":"9.png","cap":""},{"k":"img","src":"images/img-131b821218.jpg","name":"10.png","cap":""},{"k":"img","src":"images/img-7dc851c764.jpg","name":"11.png","cap":""}]},{"id":"n1794303074450","type":"project","label":"Buzzin' My Feelin'","sub":"Personal","kind":"Copywriting, Concept & Design","desc":"A personal visual zine capturing unsaid words, inner noise, and the art of shifting perspectives. crafted with raw blue textures, intimate photography, and intentionally flipped layouts to give you a space to slow down, look closer, and just breathe.","icon":"images/img-102684ff09.jpg","c1":"var(--blue)","c2":"var(--sky)","x":67.3396735578505,"y":56.77357414170039,"blocks":[{"k":"img","src":"images/img-260fd88fb1.jpg","name":"3.png","cap":""},{"k":"img","src":"images/img-cbcc1aaa2a.jpg","name":"4.png","cap":""},{"k":"img","src":"images/img-f2c7aa1133.jpg","name":"5.png","cap":""},{"k":"img","src":"images/img-94199bb6ca.jpg","name":"7.png","cap":""},{"k":"img","src":"images/img-4c536d2c00.jpg","name":"8.png","cap":""},{"k":"img","src":"images/img-f71ba12793.jpg","name":"9.png","cap":""},{"k":"img","src":"images/img-3d925148ca.jpg","name":"10.png","cap":""}],"credits":[{"r":"Copywriter, Designer & Concept","n":"Syafira Putri Aulia"}],"previews":[]},{"id":"n1794304061977","type":"project","label":"What a Memories","sub":"Personal","kind":"Copywriting, Concept & Designer","desc":"the backstory\nthis project is my way of making peace with growing up. recently, i realized i’ve spent way too much time filling up everyone else’s glass while completely forgetting to check mine. hence, this zine happened. it’s a safe space, a visual hug, and an open letter to the inner child in me who tried so hard to be strong when they were hurting too.\nthe design journey\n\nthe creative direction balances the warm nostalgia of childhood with the raw, chaotic emotions of adulting:\n\n• constellation of thoughts: i connected random words together using bright blue star-constellation lines. it's a visual metaphor showing that even when our thoughts feel scattered across the universe, they can still form something beautiful if we just slow down and map them out.\n• bold red & halftone grids: the high-contrast red combined with grainy, halftone childhood photos represents that loud, overwhelming feeling of realization—the messy truth that \"i'm not good at gettin' older.\"\n• the layout language: i mixed clean typography, heavy text drops, side-profile monochrome portraiture, and a raw collage grid of \"things made me cry lately.\" it’s styled like a scrapbook of vulnerabilities rather than a rigid graphic design project.\n\nthe narrative \nat its core, this zine is a reminder of something we always forget: we don’t have to earn our right to rest, to be loved, or to take care of ourselves. it’s a visual promise to stop pouring into others when we are running on empty and a commitment to finally be a little kinder to ourselves.","icon":"images/img-c346f3540f.jpg","c1":"var(--blue)","c2":"var(--sky)","x":47.14539039737787,"y":31.054180498109993,"blocks":[{"k":"img","src":"images/img-2e2617b438.jpg","name":"2.PNG","cap":""},{"k":"img","src":"images/img-08771781cb.jpg","name":"3.PNG","cap":""},{"k":"img","src":"images/img-a025658fa2.jpg","name":"4.PNG","cap":""},{"k":"img","src":"images/img-8ccc825097.jpg","name":"5.PNG","cap":""},{"k":"img","src":"images/img-1810ca611f.jpg","name":"6.PNG","cap":""}],"credits":[{"r":"Copywriter & Designer","n":"Syafira Putri Aulia"}],"previews":[]}],"dock":[{"id":"k1794371872287","type":"link","label":"Behance","icon":"images/dock-behance.png","url":"https://www.behance.net/syafiraaulia"},{"id":"k1794371895899","type":"link","label":"Link","icon":"images/dock-link-baru.png","url":""},{"id":"k1","type":"about","label":"About","icon":"images/img-92beb844ed.png"},{"id":"k1794296745946","type":"link","label":"Email","icon":"images/img-9cf681bb7c.png","url":"\u003ca href=\"mailto:syafira.putriaulia1@://gmail.com\">drop me a line 💌\u003c/a>"},{"id":"k2","type":"email","label":"Email","icon":"images/img-6dc79bdd2f.png"},{"id":"k1794298966545","type":"link","label":"Link","icon":"images/img-aa99db0c1c.png","url":""},{"id":"k1794305493976","type":"link","label":"Link","icon":"images/dock-link-lama.png","url":"https://www.instagram.com/syafirapotter/"},{"id":"k3","type":"sep","label":null},{"id":"k4","type":"exit","label":"Exit","icon":"images/img-d29eff81ad.png"}],"wall":"images/img-de44a3bce1.jpg","folders":[{"label":"Headline (The Scroll-Stopper)","text":"The hook that makes you pause mid-scroll. Like the first photo in a carousel, it grabs attention in two seconds flat.","c":"blossom","h":"#96b3d9"},{"label":"Tagline (The Signature Vibe)","text":"The whole brand's aesthetic in one line. Like a signature film preset, it’s the core identity people always remember.","c":"sky","h":"#f2d57e"},{"label":"Caption (The Backstory)","text":"The context behind the frame. The photo catches your eye, and the caption makes you feel something and join the chat.","c":"leaf","h":"#fcf9f1"},{"label":"Ads Script (The Mini Vlog)","text":"A storyboard with a goal. Pacing the hook, visuals, and voiceover so an ad feels like a friend's recommendation, not a hard sell.","c":"blue","h":"#f2eac2"},{"label":"Broadcast Messages (The Love Letter)","text":"Direct notes that actually get opened. Not spam just warm, personal storytelling straight to the inbox.","c":"mist","h":"#a3c279"},{"label":"Zine (The Pocket Journal)","text":"A mini time capsule of words and film. Unfiltered, tactile, and made to be flipped through slowly.","c":"taupe","h":"#f2785c"}],"hero":{"a":"#325c9a","b":"#96b3d9","c":"#6c92cd"},"mac":{"noteTitle":"about-me.txt","note":"My favorite campaigns don’t start in a boardroom, they happen between four bedroom walls. I’m Syafira, a copywriter translating everyday moments into words.","hl":"2","webTitle":"Morning writing table","img":"images/block-e44acdbb0d.jpg","ico":"images/block-e44acdbb0d.jpg","ntTitle":"Syafira Putri Aulia","nt":"Captures feelings in sentences. \nOpen for a virtual coffee chat.","ntNo":"Wait","f1":"Headlines","f2":"Concept","f3":"Campaign","pos":{"d":{"f1":{"x":7.33,"y":49.86,"z":41},"cc":{"x":68.72,"y":6.65,"z":45}}}}}</script>

 const N=Math.min(60000,w*h/6);
 for(let i=0;i<N;i++){const px=rnd()*w,top=ridge(px),py=top+(hor-top)*Math.pow(rnd(),1.7),dd=(py-top)/(hor-top);

  x.globalAlpha=.2;x.fillStyle=rnd()<.5?blue:sky;x.fillRect(px,py,2+rnd()*9,1)}
 x.globalAlpha=.4;x.fillStyle=blue;x.fillRect(0,hor,w,1)}
