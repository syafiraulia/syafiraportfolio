<style>

 at 11.27.51 AM.jpeg","cap":""},{"k":"img","src":"images/block-8f0a59c395.jpg","name":"WhatsApp Image 2026-10-23 at 3.07.28 PM.jpeg","cap":""},{"k":"img","src":"images/block-1526000b96.jpg","name":"WhatsApp Image 2026-10-30 at 1.24.56 PM.jpeg","cap":""},{"k":"img","src":"images/block-c8afc57ad7.jpg","name":"WhatsApp Image 2026-10-19 at 5.25.29 PM.jpeg","cap":""},{"k":"img","src":"images/block-813148bc37.jpg","name":"Physical VS Chemical.png","cap":""},{"k":"img","src":"images/block-ff18f8fe9f.jpg","name":"WhatsApp Image 2026-10-08 at 2.56.44 PM.jpeg","cap":""},{"k":"img","src":"images/block-99a0129ceb.jpg","name":"WhatsApp Image 2026-09-23 at 9.50.08 AM.jpeg","cap":""},{"k":"img","src":"images/block-42ce546412.jpg","name":"WhatsApp Image 2026-09-04 at 4.05.40 PM.jpeg","cap":""},{"k":"img","src":"images/block-4fcdc99d05.jpg","name":"WhatsApp Image 2026-07-15 at 11.30.26 AM.jpeg","cap":""},{"k":"img","src":"images/block-ae565f8872.jpg","name":"WhatsApp Image 2026-06-02 at 5.09.30 PM.jpeg","cap":""}]},{"id":"p2","type":"project","label":"About Me","sub":"Syafira Putri Aulia","kind":"About Me","desc":"hi, i’m Fira copywriter who captures feelings in sentences.\n\ni’ve always been someone who stares a little too long at things the way the afternoon light hits a page, the chaotic thoughts we hide behind quiet smiles, or the visual rhythm of an indie zine. to me, writing copy is exactly like that. it’s not about stringing fancy words together just to sell things; it’s about capturing a mood, starting a conversation, and making someone on the other side of the screen pause and think, \"ah, someone finally gets it.\"\n\nmy journey with words started from a love for raw, unfiltered storytelling and visual aesthetics. \n\nwhether i’m designing a flipped-layout zine about the noise in our heads or crafting a brand's tone of voice, my goal remains the same: to find the heartbeat behind the message. i love stripping away the corporate fluff and replacing it with copy that feels human, cozy, and comforting.\nmy philosophy? good copy should feel like a late-night talk with a friend or a familiar melody playing in a local coffee shop. it’s strategic, yes, but it always starts with genuine connection. i specialize in translating complex ideas, brand concepts, and creative visions into warm, resonant, and memorable stories.\n\nif you’re looking for a writer to give your brand a soul, or just want to collaborate on something thoughtful let’s chat over a virtual coffee.","icon":"images/icon-5250d121c9.png","c1":"var(--blossom)","c2":"var(--paper)","x":32,"y":46,"previews":[],"credits":[{"r":"Copywriter","n":"Syafira Putri Aulia"}],"blocks":[{"k":"img","src":"images/block-e44acdbb0d.jpg","name":"5.PNG","cap":""}]},{"id":"p3","type":"project","label":"The Art of Emphaty","sub":"Personal","kind":"Copywriting, Concept & Design","desc":"in a world that’s always moving too fast, i wanted to create a cozy visual space to talk about connection. \"the art of empathy\" is a tactile, interactive zine designed to redefine how we listen, see, and understand each other. no textbook boring stuff—just raw thoughts and good energy.","icon":"images/icon-789bb3ac76.jpg","c1":"var(--leaf)","c2":"var(--mist)","x":66,"y":22,"previews":[],"credits":[{"r":"Copywriter","n":"Syafira Putri Aulia"}],"blocks":[{"k":"img","src":"images/block-80a908a5a3.jpg","name":"4.png","cap":""},{"k":"img","src":"images/block-380b6d456b.jpg","name":"5.png","cap":""},{"k":"img","src":"images/block-b0d94ba04f.jpg","name":"6.png","cap":""},{"k":"img","src":"images/block-14dcc28434.jpg","name":"7.png","cap":""},{"k":"img","src":"images/block-789bb3ac76.jpg","name":"8.png","cap":""},{"k":"img","src":"images/block-dc5f7d2be0.jpg","name":"9.png","cap":""},{"k":"img","src":"images/block-957f19018e.jpg","name":"10.png","cap":""},{"k":"img","src":"images/block-da486164d4.jpg","name":"11.png","cap":""}]},{"id":"n1794303074450","type":"project","label":"Buzzin' My Feelin'","sub":"Personal","kind":"Copywriting, Concept & Design","desc":"A personal visual zine capturing unsaid words, inner noise, and the art of shifting perspectives. crafted with raw blue textures, intimate photography, and intentionally flipped layouts to give you a space to slow down, look closer, and just breathe.","icon":"images/icon-89e2613e36.jpg","c1":"var(--blue)","c2":"var(--sky)","x":67.3396735578505,"y":56.77357414170039,"blocks":[{"k":"img","src":"images/block-0667dfb41c.jpg","name":"3.png","cap":""},{"k":"img","src":"images/block-aaf58482c6.jpg","name":"4.png","cap":""},{"k":"img","src":"images/block-a121c86e3c.jpg","name":"5.png","cap":""},{"k":"img","src":"images/block-20bdad8dc8.jpg","name":"7.png","cap":""},{"k":"img","src":"images/block-e324d15751.jpg","name":"8.png","cap":""},{"k":"img","src":"images/block-5ace856610.jpg","name":"9.png","cap":""},{"k":"img","src":"images/block-89e2613e36.jpg","name":"10.png","cap":""}],"credits":[{"r":"Copywriter, Designer & Concept","n":"Syafira Putri Aulia"}],"previews":[]},{"id":"n1794304061977","type":"project","label":"What a Memories","sub":"Personal","kind":"Copywriting, Concept & Designer","desc":"the backstory\nthis project is my way of making peace with growing up. recently, i realized i’ve spent way too much time filling up everyone else’s glass while completely forgetting to check mine. hence, this zine happened. it’s a safe space, a visual hug, and an open letter to the inner child in me who tried so hard to be strong when they were hurting too.\nthe design journey\n\nthe creative direction balances the warm nostalgia of childhood with the raw, chaotic emotions of adulting:\n\n• constellation of thoughts: i connected random words together using bright blue star-constellation lines. it's a visual metaphor showing that even when our thoughts feel scattered across the universe, they can still form something beautiful if we just slow down and map them out.\n• bold red & halftone grids: the high-contrast red combined with grainy, halftone childhood photos represents that loud, overwhelming feeling of realization—the messy truth that \"i'm not good at gettin' older.\"\n• the layout language: i mixed clean typography, heavy text drops, side-profile monochrome portraiture, and a raw collage grid of \"things made me cry lately.\" it’s styled like a scrapbook of vulnerabilities rather than a rigid graphic design project.\n\nthe narrative \nat its core, this zine is a reminder of something we always forget: we don’t have to earn our right to rest, to be loved, or to take care of ourselves. it’s a visual promise to stop pouring into others when we are running on empty and a commitment to finally be a little kinder to ourselves.","icon":"images/icon-071d84628f.jpg","c1":"var(--blue)","c2":"var(--sky)","x":47.14539039737787,"y":31.054180498109993,"blocks":[{"k":"img","src":"images/block-071d84628f.jpg","name":"2.PNG","cap":""},{"k":"img","src":"images/block-28c7a911d0.jpg","name":"3.PNG","cap":""},{"k":"img","src":"images/block-02ad1c9da5.jpg","name":"4.PNG","cap":""},{"k":"img","src":"images/block-e44acdbb0d.jpg","name":"5.PNG","cap":""},{"k":"img","src":"images/block-2ffd50e388.jpg","name":"6.PNG","cap":""}],"credits":[{"r":"Copywriter & Designer","n":"Syafira Putri Aulia"}],"previews":[]}],"dock":[{"id":"k1","type":"about","label":"Tentang","icon":"images/dock-1-tentang.png"},{"id":"k1794296745946","type":"link","label":"Email","icon":"images/dock-2-email.png","url":"\u003ca href=\"mailto:syafira.putriaulia1@://gmail.com\">drop me a line 💌\u003c/a>"},{"id":"k2","type":"email","label":"Email","icon":"images/dock-3-email.png"},{"id":"k1794298966545","type":"link","label":"Link","icon":"images/dock-4-link.png","url":""},{"id":"k1794305493976","type":"link","label":"Link","icon":"images/icon-83f3dee7b0.png","url":"https://www.instagram.com/syafirapotter/"},{"id":"k3","type":"sep"},{"id":"k4","type":"exit","label":"Keluar","icon":"images/dock-5-keluar.png"}],"wall":"images/wall-0667dfb41c.jpg"}</script>

 addEventListener('pointerup',()=>{if(rd&&RMODE==='cover'){RT=Math.round(RC+Math.max(-4,Math.min(4,RCV*9)));RFREE=0}rd=null;r.classList.remove('drag')});
 r.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){e.preventDefault();if(RMODE==='cover'){RC+=e.deltaX/(RSTEP*1.6);RFREE=1;clearTimeout(RWT);RWT=setTimeout(()=>{RT=Math.round(RC);RFREE=0},110)}else RV+=dr(e.deltaX)*.15}},{passive:false});
 $('#rtrack').addEventListener('click',e=>{const b=e.target.closest('.ri');if(!b||rdm>6)return;if(RMODE==='cover'){const o=RL.find(x=>x.e===b);if(o&&Math.abs(o.d)>.5){RT=Math.round(RC+o.d);return}}const i=+b.dataset.i;location.hash='#karya';setTimeout(()=>{if(S.items[i])openWin(S.items[i],null)},150)});
 rls=scrollY;addEventListener('scroll',()=>{const d=scrollY-rls;rls=scrollY;RV+=Math.max(-40,Math.min(40,d))*.0009});
 (function lp(){reelFrame();requestAnimationFrame(lp)})()})();

/* routing */
function route(){const g=location.hash==='#karya';$('#landing').classList.toggle('on',!g);$('#gallery').classList.toggle('on',g);scrollTo(0,0);if(!g){requestAnimationFrame(()=>{drawMt();initP();layoutWords()})}}
addEventListener('hashchange',route);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{drawMt();initP();layoutWords()},150)});

/* mode edit (hanya pemilik) */
let owner=false,fi=-1,pick=null,dki=0;
const msg=t=>{const m=$('#msg');if(m)m.textContent=t};
const mv=i=>'<button data-a="dup" data-i="'+i+'">Kiri</button><button data-a="ddn" data-i="'+i+'">Kanan</button>';
function dockUI(){return '<h3>Dock</h3><button data-a="da">+ Ikon</button><button data-a="ds">+ Pemisah</button>'+S.dock.map((d,i)=>d.type==='sep'?'<div class="wr"><div><b>— Pemisah —</b><br>'+mv(i)+'<button data-a="ddel" data-i="'+i+'">Hapus</button></div></div>':'<div class="wr"><div class="th" style="'+th(d.icon)+'"></div><div><input data-dk="label" data-i="'+i+'" placeholder="Nama" value="'+esc(d.label)+'">'+(d.type==='link'?'<input data-dk="url" data-i="'+i+'" placeholder="https://… atau mailto:" value="'+esc(d.url||'')+'" style="margin-top:4px">':'')+'<button data-a="dicon" data-i="'+i+'">Ganti ikon</button><button data-a="dicox" data-i="'+i+'">Ikon awal</button>'+mv(i)+'<button data-a="ddel" data-i="'+i+'">Hapus</button></div></div>').join('')}
const th=u=>u?'background-image:url('+esc(u)+')':'background:var(--mist)';
const KL={img:'Gambar',video:'Video',pdf:'PDF',text:'Tulisan',link:'Link'};
function blockRow(x,i){const I=' data-i="'+i+'"',inp=(f,ph,st)=>'<input data-b="'+f+'"'+I+' placeholder="'+ph+'" value="'+esc(x[f])+'"'+(st?' style="'+st+'"':'')+'>';
 let f;if(x.k==='text')f=inp('title','Judul (opsional)')+'<textarea data-b="text"'+I+' rows="4" placeholder="Tulis di sini…" style="margin-top:4px">'+esc(x.text)+'</textarea>';
 else if(x.k==='link')f=inp('name','Teks link')+inp('url','https://…','margin-top:4px');
 else f=inp('cap',x.k==='pdf'?'Judul dokumen (opsional)':'Keterangan (opsional)');
 const tn=x.k==='img'?'<div class="th" style="'+th(x.src)+'"></div>':'<div class="th kt">'+KL[x.k]+'</div>';
 return '<div class="wr">'+tn+'<div><b>'+KL[x.k]+'</b>'+(x.name&&x.k!=='link'?' <small style="color:var(--muted)">'+esc(x.name)+'</small>':'')+f+'<br><button data-a="bup"'+I+'>Naik</button><button data-a="bdn"'+I+'>Turun</button><button data-a="bdel"'+I+'>Hapus</button></div></div>'}
function panel(){const c=S.colors,it=S.items[fi];let h='<h2>Edit situs</h2>';
 if(it){h+='<button data-a="back">‹ Kembali</button><h3>Proyek: '+esc(it.label)+'</h3>'+
  [['label','Judul (nama ikon)'],['sub','Subjudul / klien'],['kind','Jenis (Type)']].map(a=>'<label>'+a[1]+'<input data-p="'+a[0]+'" value="'+esc(it[a[0]])+'"></label>').join('')+
  '<label>Deskripsi<textarea data-p="desc" rows="6">'+esc(it.desc||'')+'</textarea></label>'+
  '<div class="wr"><div class="th" style="'+th(it.icon)+'"></div><div><b>Gambar ikon</b><br><button data-a="icon">Ganti</button><button data-a="iconx">Hapus</button></div></div>'+
  '<h3>Konten popup</h3><p style="font-size:12px;color:var(--muted);margin:0 0 6px">Tambah gambar, video, PDF, tulisan, atau link. Semuanya tampil di popup proyek sesuai urutan di sini. Ukuran tiap file maksimal 20 MB.</p><button data-a="badd" data-k="img">+ Gambar</button><button data-a="badd" data-k="video">+ Video</button><button data-a="badd" data-k="pdf">+ PDF</button><button data-a="badd" data-k="text">+ Tulisan</button><button data-a="badd" data-k="link">+ Link</button>'+(it.blocks||[]).map(blockRow).join('')+
  '<h3>Credits</h3>'+(it.credits||[]).map((x,i)=>'<div class="wr"><div><input data-cr="r" data-i="'+i+'" placeholder="Peran, mis. Photo" value="'+esc(x.r)+'"><input data-cr="n" data-i="'+i+'" placeholder="Nama" value="'+esc(x.n)+'" style="margin-top:4px"><button data-a="cdel" data-i="'+i+'">Hapus</button></div></div>').join('')+'<button data-a="cadd">+ Credit</button>'}
 else{h+='<p style="font-size:13px;color:var(--muted)">Perubahan langsung terlihat. Klik Simpan agar tampil untuk pengunjung.</p><h3>Teks</h3>'+
  [['name','Nama'],['role','Profesi'],['tagline','Tagline (kata dipisah spasi)'],['cta','Tombol masuk'],['about','Tentang (teks)'],['email','Email']].map(a=>'<label>'+a[1]+'<input data-k="'+a[0]+'" value="'+esc(S[a[0]])+'"></label>').join('')+
  '<h3>Warna</h3>'+Object.keys(CL).map(k=>'<label class="cl"><input type="color" data-c="'+k+'" value="'+c[k].toLowerCase()+'"><span>'+CL[k]+'<small>'+c[k]+'</small></span></label>').join('')+
  '<button data-a="reset">Kembalikan warna awal</button><h3>Desktop</h3><button data-a="wall">Ganti wallpaper</button><button data-a="wallx">Wallpaper awal</button>'+dockUI()+'<h3>Proyek</h3><button data-a="nf">+ Proyek baru</button>'+
  S.items.map((x,i)=>'<div class="wr"><div class="th" style="'+th(x.icon)+'"></div><div><b>'+esc(x.label)+'</b><br><button data-a="fopen" data-i="'+i+'">Edit</button><button data-a="idel" data-i="'+i+'">Hapus</button></div></div>').join('')}
 h+='<input type="file" id="pick" accept="image/*" hidden><div class="bar"><button data-a="save">Simpan dan publikasikan</button> <button data-a="close">Tutup</button> <span id="msg" style="font-size:12px"></span></div>';
 $('#ed .in').innerHTML=h}
const ed=$('#ed');
ed.addEventListener('input',e=>{const t=e.target,d=t.dataset,it=S.items[fi];
 if(d.k){S[d.k]=t.value;renderText();renderDesk()}
 else if(d.c){S.colors[d.c]=t.value;applyColors();drawMt();renderBrand();t.nextElementSibling.querySelector('small').textContent=t.value}
 else if(d.dk){S.dock[+d.i][d.dk]=t.value;renderDock()}
 else if(d.p){it[d.p]=t.value;renderDesk()}
 else if(d.b){it.blocks[+d.i][d.b]=t.value;refreshWins()}
 else if(d.cr){it.credits[+d.i][d.cr]=t.value;refreshWins()}});
ed.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,it=S.items[fi],L=it&&it.blocks;
 const pk=k=>{pick=k;const f=$('#pick');f.multiple=(k==='img');f.accept=k==='video'?'video/*':k==='pdf'?'application/pdf':'image/*';f.value='';f.click()};
 if(a==='close')ed.classList.remove('on');
 else if(a==='save')save();
 else if(a==='reset'){S.colors=Object.assign({},COL0);applyColors();drawMt();renderBrand();panel()}
 else if(a==='wall')pk('wall');
 else if(a==='wallx'){S.wall='';renderDesk()}
 else if(a==='nf'){S.items.push({id:'n'+Date.now(),type:'project',label:'Proyek baru',sub:'',kind:'',desc:'',icon:'',c1:'var(--blue)',c2:'var(--sky)',x:30+Math.random()*40,y:18+Math.random()*50,blocks:[],credits:[]});renderDesk();fi=S.items.length-1;panel()}
 else if(a==='icon')pk('icon');
 else if(a==='iconx'){it.icon='';renderDesk();panel()}
 else if(a==='idel'){S.items.splice(i,1);renderDesk();panel()}
 else if(a==='fopen'){fi=i;panel()}
 else if(a==='back'){fi=-1;panel()}
 else if(a==='badd'){const k=b.dataset.k;if(k==='text')L.push({k:'text',title:'',text:''});else if(k==='link')L.push({k:'link',name:'',url:''});else{pk(k);return}refreshWins();panel()}
 else if(a==='bdel'){L.splice(i,1);refreshWins();buildReel();panel()}
 else if(a==='bup'&&i>0){[L[i-1],L[i]]=[L[i],L[i-1]];refreshWins();buildReel();panel()}
 else if(a==='bdn'&&i<L.length-1){[L[i+1],L[i]]=[L[i],L[i+1]];refreshWins();buildReel();panel()}
 else if(a==='da'){const s=S.dock.findIndex(d=>d.type==='sep');S.dock.splice(s<0?S.dock.length:s,0,{id:'k'+Date.now(),type:'link',label:'Link',icon:'',url:''});renderDock();panel()}
 else if(a==='ds'){S.dock.push({id:'k'+Date.now(),type:'sep'});renderDock();panel()}
 else if(a==='ddel'){S.dock.splice(i,1);renderDock();panel()}
 else if(a==='dup'&&i>0){[S.dock[i-1],S.dock[i]]=[S.dock[i],S.dock[i-1]];renderDock();panel()}
 else if(a==='ddn'&&i<S.dock.length-1){[S.dock[i+1],S.dock[i]]=[S.dock[i],S.dock[i+1]];renderDock();panel()}
 else if(a==='dicon'){dki=i;pk('dock')}
 else if(a==='dicox'){S.dock[i].icon='';renderDock();panel()}
 else if(a==='cadd'){(it.credits=it.credits||[]).push({r:'',n:''});panel()}
 else if(a==='cdel'){it.credits.splice(i,1);refreshWins();panel()}});
ed.addEventListener('change',async e=>{if(e.target.id!=='pick'||!pick)return;const P=pick,files=[...e.target.files];if(!files.length)return;
 const as=await claude.use('assets');if(!as){msg('Upload butuh akses editor.');return}
 for(const f of files){if(f.size>20*1024*1024){msg(f.name+' lebih dari 20 MB');continue}try{msg('Mengunggah '+f.name+'…');const r=await as.upload(f),u='/_blob/'+r.id;
  if(P==='wall')S.wall=u;else if(P==='dock')S.dock[dki].icon=u;else if(P==='icon')S.items[fi].icon=u;else(S.items[fi].blocks=S.items[fi].blocks||[]).push({k:P,src:u,name:f.name,cap:''})}catch(x){msg('Gagal: '+f.name)}}
 renderDesk();renderDock();panel();msg('Selesai. Jangan lupa Simpan.')});
async function save(){try{msg('Menyimpan…');const art=await claude.use('artifact');
 const doc=new DOMParser().parseFromString(SRC,'text/html');doc.getElementById('data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
 await art.publish('<!DOCTYPE html>'+doc.documentElement.outerHTML)}catch(x){msg('Gagal menyimpan'+(x&&x.code?' ('+x.code+')':''))}}
$('#editbtn').onclick=()=>{fi=-1;panel();ed.classList.add('on')};

(S.items||[]).forEach(it=>{it.blocks=it.blocks||[];(it.previews||[]).forEach(u=>it.blocks.push({k:'img',src:u}));it.previews=[]});
applyColors();renderText();renderGrid();route();drawMt();initP();loop();
document.fonts&&document.fonts.ready.then(layoutWords);
if(window.claude){claude.use('user').then(u=>{owner=!!(u&&(u.isOwner()||u.canEdit()));if(owner)$('#editbtn').style.display='block'}).catch(()=>{})}
